name: Release

# Tag a commit `vX.Y.Z` and push the tag: three builds run in parallel and a GitHub Release is
# published with the APK, the Windows zip and the Linux tarball + installer attached.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.41.6

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Release signing (optional, from secrets)
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
      - name: Build
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          flutter pub get
          flutter build apk --release --build-name="$VERSION" --build-number="$GITHUB_RUN_NUMBER"
          mv build/app/outputs/flutter-apk/app-release.apk "build/CoolBar-$VERSION.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: app/build/CoolBar-*.apk

  windows:
    name: Windows menubar app
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Build
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          flutter config --enable-windows-desktop
          flutter pub get
          flutter build windows --release --build-name="$VERSION" --build-number="$GITHUB_RUN_NUMBER"
      - name: Zip
        shell: pwsh
        run: |
          $v = $env:GITHUB_REF_NAME.TrimStart('v')
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath "build\CoolBar-$v-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: app/build/CoolBar-*-windows-x64.zip

  linux:
    name: Linux menubar app
    runs-on: ubuntu-22.04   # older glibc = runs on more distributions
    steps:
      - uses: actions/checkout@v4
      - name: System GTK bindings
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-gi python3-gi-cairo gir1.2-gtk-3.0 python3-venv
      - name: Build bundle
        run: |
          python3 -m venv --system-site-packages .venv
          .venv/bin/pip install -q bleak dbus_next cryptography pyinstaller
          packaging/linux/build.sh "$GITHUB_REF_NAME"
          VERSION="${GITHUB_REF_NAME#v}"
          mv dist/coolbar-linux-x64.tar.gz "dist/CoolBar-$VERSION-linux-x64.tar.gz"
          cp dist/CoolBar-$VERSION-linux-x64.tar.gz dist/coolbar-linux-x64.tar.gz   # stable name for install.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.tar.gz
            dist/install.sh

  release:
    name: Publish GitHub Release
    needs: [android, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            out/android/*
            out/windows/*
            out/linux/*
